<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style type="text/css">
.container {
	margin-top: 20px
}
.row {
	margin: 0px auto;
	width: 700px;
}
h3 {
	text-align: center
}
</style>

</head>
<body>
<div class="container">
	<div class="row">
		<h3>내용 보기</h3>
		<table class="table" style="margin-top: 20px">
			<tr>
				<td width="15%" class="text-center success">번호</td>
				<td width="35%" class="text-center">[[${vo.no}]]</td>
				<td width="15%" class="text-center success">작성일</td>
				<td width="35%" class="text-center">[[${vo.regdate}]]</td>
			</tr>
			<tr>
				<td width="15%" class="text-center success">이름</td>
				<td width="35%" class="text-center">[[${vo.name}]]</td>
				<td width="15%" class="text-center success">조회수</td>
				<td width="35%" class="text-center">[[${vo.hit}]]</td>
			</tr>
			<tr>
				<td width="15%" class="text-center success">제목</td>
				<td colspan="3" class="text-left">[[${vo.subject}]]</td>
			</tr>
			<tr>
				<td colspan="4" valign="top" class="text-left" height="200px">
					<pre style="white-space: pre-wrap; border: none; background-color: white">[[${vo.content}]]</pre>
				</td>
			</tr>
			<tr>
				<td colspan="4"class="text-right">
					<a th:href="@{/board/update(no=${vo.no})}" class="btn btn-xs btn-warning">수정</a>
					<a th:href="@{/board/delete(no=${vo.no})}" class="btn btn-xs btn-warning">삭제</a>
					<a href="/board/list" class="btn btn-xs btn-warning">목록</a>
				</td>
			</tr>
		</table>
	</div>
</div>
</body>
</html>
