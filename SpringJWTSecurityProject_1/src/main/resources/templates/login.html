<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style type="text/css">
.container{
	margin-top: 50px
}
.row {
	width: 350px;
	margin: 0px auto;
}
</style>
</head>
<body>
<div class="container">
	<div class="row">
		<h3 class="text-center">로그인 페이지</h3>

		  <table class="table">
			<tbody>
				<tr>
					<th width="20%" class="text-center">ID</th>
					<td width="80%">
						<input type="text" id="username" size="20" class="input-sm" required>
					</td>
				</tr>
				<tr>
					<th width="20%" class="text-center">PW</th>
					<td width="80%">
						<input type="password" id="password" size="20" class="input-sm" required>
					</td>
				</tr>
				<tr>
					<td colspan="2" class="text-center">
						<button type="button" class="btn btn-sm btn-success" onclick="javascript:login()">로그인</button>
						<button type="button" class="btn btn-sm btn-danger"
								onclick="javascript:history.back()">
							취소
						</button>
					</td>
				</tr>
			</tbody>
		  </table>

	</div>
</div>
<script>
	async function login(){
		const p=new URLSearchParams()
		p.append("username",username.value)
		p.append("password",password.value)
		
		const res=await fetch("/member/login",{
			method:"POST",
			body:p
		})
		const token=await res.text()
		localStorage.setItem("token",token)
		location.href="/"
	}
</script>
</body>
</html>
