<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style type="text/css">
.container {
	margin-top: 30px
}
.row {
	margin: 0px auto;
	width: 600px;
}
h3 {
	text-align: center;
}
</style>
<script type="text/javascript" src="http://code.jquery.com/jquery.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script src="https://unpkg.com/vue@3.3.4/dist/vue.global.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="https://unpkg.com/vue-demi"></script>
<script src="https://unpkg.com/pinia@2.1.7/dist/pinia.iife.prod.js"></script>
</head>
<body>
  <div class="container">
  	<div class="row">
  	  <h3>1:1 채팅</h3>
  	  <table class="table">
  	  	<tbody>
  	  	  <tr>
  	  	    <td>
  	  	      <input type="text" class="input-sm" size="20"
  	  	      	placeholder="본인 아이디" v-model="store.userId" ref="userId">
  	  	      <button type="button" class="btn btn-sm btn-info" @click="store.connect()">접속</button>
  	  	    </td>
  	  	  </tr>
  	  	  <tr>
  	  	    <td>
  	  	      <input type="text" class="input-sm" size="20"
  	  	      	placeholder="상대방 아이디" v-model="store.receiver" ref="receiver">
  	  	    </td>
  	  	  </tr>
  	  	  <tr>
  	  	    <td>
  	  	      <input type="text" class="input-sm" size="100"
  	  	      	placeholder="보낼 메시지" v-model="store.msg" ref="msg" @keydown.enter="store.send()">
  	  	    </td>
  	  	  </tr>
  	  	  <tr>
  	  	    <td>
  	  	      <button type="button" class="btn btn-sm btn-danger" @click="store.send()">전송</button>
  	  	    </td>
  	  	  </tr>
  	  	  <tr>
  	  	    <td>
  	  	      <ul>
  	  	      	<li v-for="(m,i) in store.message" :key="i">
  	  	      		{{m.sender}} | {{m.message}}
  	  	      	</li>
  	  	      </ul>
  	  	    </td>
  	  	  </tr>
  	  	</tbody>
  	  </table>
  	</div>
  </div>
<script src="/js/chatStore.js"></script>
<script>
const {ref,onMounted,createApp} = Vue
const {createPinia} = Pinia

const chatApp=createApp({
	setup(){
		const store=useChatStore()
		
		return {
			store
		}
	}
})
chatApp.use(createPinia())
chatApp.mount('.container')
</script>
</body>
</html>
