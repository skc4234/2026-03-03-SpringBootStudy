<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI Chat</title>
    <link rel="stylesheet" href="/chat.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🤖 Spring AI Chat (Streaming)</h1>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message assistant">
            <div class="message-content">
                안녕하세요! 무엇을 도와드릴까요?
            </div>
        </div>
    </div>
    <div class="input-area">
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." />
            <button id="sendButton">전송</button>
        </div>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');

    let currentAssistantMessage = null;

    function addUserMessage(message) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message user';
        messageDiv.innerHTML = `<div class="message-content">${escapeHtml(message)}</div>`;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function createAssistantMessage() {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant';
        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        messageDiv.appendChild(contentDiv);
        chatBox.appendChild(messageDiv);
        return contentDiv;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        addUserMessage(message);
        messageInput.value = '';
        sendButton.disabled = true;

        currentAssistantMessage = createAssistantMessage();
        let fullResponse = '';

        try {
            const response = await fetch(`/chat/stream?message=${encodeURIComponent(message)}`);
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let content = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) {
                     console.log('Stream complete');
                    break;
                }
                const chunk = decoder.decode(value);
                content += chunk;
                console.log(content);
                currentAssistantMessage.textContent = content;
            }
        } catch (error) {
            currentAssistantMessage.textContent = '오류가 발생했습니다. 다시 시도해주세요.';
            console.error('Error:', error);
        }
        sendButton.disabled = false;
        currentAssistantMessage = null;
    }

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
